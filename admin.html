        let allPatients = [];

function checkDateFilter(patientTime){

    const filter = document.getElementById("filter-date").value;

    if(filter==="") return true;

    let text = String(patientTime);

    // đổi <br> thành xuống dòng
    text = text.replace(/<br\s*\/?>/gi,"\n");

    const lines = text.split(/\r?\n/);

    // tìm dòng có dạng dd/mm/yyyy
    let dateStr = "";

    for(const line of lines){

        if(/\d{2}\/\d{2}\/\d{4}/.test(line)){
            dateStr = line.match(/\d{2}\/\d{2}\/\d{4}/)[0];
            break;
        }

    }

    if(dateStr==="") return true;

    const arr = dateStr.split("/");

    const d = new Date(
        Number(arr[2]),
        Number(arr[1])-1,
        Number(arr[0])
    );

    d.setHours(0,0,0,0);

    const today = new Date();
    today.setHours(0,0,0,0);

    const yesterday = new Date(today);
    yesterday.setDate(today.getDate()-1);

    if(filter==="today")
        return d.getTime()===today.getTime();

    if(filter==="yesterday")
        return d.getTime()===yesterday.getTime();

    if(filter==="custom"){

    const from=document.getElementById("from-date").value;
    const to=document.getElementById("to-date").value;

    if(!from || !to)
        return true;

    // yyyy-mm-dd
    const fArr = from.split("-");
    const tArr = to.split("-");

    const f = new Date(
        Number(fArr[0]),
        Number(fArr[1])-1,
        Number(fArr[2]),
        0,0,0
    );

    const t = new Date(
        Number(tArr[0]),
        Number(tArr[1])-1,
        Number(tArr[2]),
        23,59,59
    );

    return d >= f && d <= t;
}

    return true;

}
        
        function renderTable() {
            const searchKw = document.getElementById('search').value.toLowerCase();
            const riskFilter = document.getElementById('filter-risk').value;
            const tbody = document.getElementById('patient-tbody');

            const filtered = allPatients.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchKw) || p.phone.includes(searchKw) || p.id.toLowerCase().includes(searchKw);
                const matchRisk = riskFilter === "" || p.color === riskFilter;

const matchDate = checkDateFilter(p.time);

return matchSearch && matchRisk && matchDate;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8;">Không tìm thấy hồ sơ bệnh nhân nào.</td></tr>`;
                return;
            }


            tbody.innerHTML = filtered.map(p => `
                <tr>
                    <td>${p.time}</td>
                    <td><b>${p.id}</b></td>
                    <td>${p.name.toUpperCase()}</td>
                    <td>${p.age} tuổi - ${p.phone}</td>
                    <td>${p.reason}</td>
                    <td><span class="badge badge-${p.color}">${p.color}</span></td>
                    <td>
<button class="btn-view"
onclick="showDetail('${p.id}')">
Xem chi tiết
</button>
</td>
                </tr>
            `).join('');
        }
