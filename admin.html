<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý An Toàn MRI - BV ĐA KHOA THỦ ĐỨC</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #334155; }
        .header { background: #1d4ed8; color: white; padding: 15px 20px; border-radius: 8px; font-size: 20px; font-weight: bold; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        .controls input, .controls select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        th, td { padding: 10px; border: 1px solid #cbd5e1; text-align: left; }
        th { background: #f8fafc; color: #1e3a8a; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; color: white; font-size: 11px; }
        .badge-RED { background: #dc2626; }
        .badge-YELLOW { background: #d97706; }
        .badge-GREEN { background: #16a34a; }
        .btn-view { background: #2563eb; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .page-break{
    display:none;
}

@media print{

    .page-break{
        display:block;
        page-break-after:always;
    }

    #detailModal{
        position:static !important;
        background:white !important;
    }

    #detailModal > div{
        width:100% !important;
        max-height:none !important;
        overflow:visible !important;
        margin:0 !important;
        box-shadow:none !important;
    }

    .header,
    .panel,
    button{
        display:none !important;
    }

}
</style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="header">
        <span>🖥️ BẢNG ĐIỀU HÀNH PHÒNG CHỤP MRI - THỜI GIAN THỰC</span>
        <span id="connection-status" style="font-size: 13px; background: #16a34a; padding: 4px 8px; border-radius: 4px;">🟢 Đang kết nối Firebase</span>
    </div>

    <div class="panel">
        <div class="controls">
            <input type="text" id="search" placeholder="Tìm tên bệnh nhân / SĐT..." onkeyup="renderTable()">
            <select id="filter-risk" onchange="renderTable()">
                <option value="">Tất cả mức độ nguy cơ</option>
                <option value="RED">ĐỎ (Chống chỉ định)</option>
                <option value="YELLOW">VÀNG (Cần báo Bác sĩ)</option>
                <option value="GREEN">XANH (An toàn)</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Thời gian</th>
                    <th>Mã Hồ Sơ</th>
                    <th>Họ và Tên</th>
                    <th>Tuổi / SĐT</th>
                    <th>Lý Do Đi Chụp</th>
                    <th>Mức Nguy Cơ</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody id="patient-tbody">
                <tr><td colspan="7" style="text-align:center;">Đang tải dữ liệu từ máy chủ...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // THAY MÃ FIREBASE CONFIG CỦA BẠN VÀO ĐÂY
        const firebaseConfig = {
  apiKey: "AIzaSyDjWIZl60JZlZjnFIEhezCFcomKS5OEQc4",
  authDomain: "antoanconghuongtu.firebaseapp.com",
  databaseURL: "https://antoanconghuongtu-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "antoanconghuongtu",
  storageBucket: "antoanconghuongtu.firebasestorage.app",
  messagingSenderId: "458456831621",
  appId: "1:458456831621:web:f2936a421ca8303c5a7bec"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
console.log("Firebase connected");
               
        let allPatients = [];

        // Tự động nhận dữ liệu realtime khi bệnh nhân gửi phiếu
        db.ref("patients").on("value", function(snapshot){

    allPatients = [];

    snapshot.forEach(function(child){

        allPatients.unshift(child.val());

    });

    renderTable();

}, function(error){

    console.log(error);

    alert("Không đọc được dữ liệu Firebase");

});
        
        function renderTable() {
            const searchKw = document.getElementById('search').value.toLowerCase();
            const riskFilter = document.getElementById('filter-risk').value;
            const tbody = document.getElementById('patient-tbody');

            const filtered = allPatients.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchKw) || p.phone.includes(searchKw) || p.id.toLowerCase().includes(searchKw);
                const matchRisk = riskFilter === "" || p.color === riskFilter;
                return matchSearch && matchRisk;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8;">Không tìm thấy hồ sơ bệnh nhân nào.</td></tr>`;
                return;
            }


            tbody.innerHTML = filtered.map(p => `
                <tr>
                    <td>${p.time}</td>
                    <td><b>${p.id}</b></td>
                    <td><b>${p.name}</b></td>
                    <td>${p.age} tuổi - ${p.phone}</td>
                    <td>${p.reason}</td>
                    <td><span class="badge badge-${p.color}">${p.color}</span></td>
                    <td>
<button class="btn-view"
onclick="showDetail('${p.id}')">
Xem chi tiết
</button>
</td>
                </tr>
            `).join('');
        }
function showDetail(id){

    const p = allPatients.find(x => x.id === id);

    if(!p){
        alert("Không tìm thấy hồ sơ");
        return;
    }

    let answerTable="";

    if(p.fullAnswers && p.fullAnswers.length){

        answerTable=`

        <h3 style="text-align:center;margin:15px 0;">
            BẢNG CÂU TRẢ LỜI KHAI BÁO AN TOÀN MRI
        </h3>

        <table style="width:100%;border-collapse:collapse;font-size:13px;">

            <tr style="background:#1d4ed8;color:white;">

                <th style="border:1px solid #ccc;padding:6px;">STT</th>

                <th style="border:1px solid #ccc;padding:6px;">Nhóm</th>

                <th style="border:1px solid #ccc;padding:6px;">Câu hỏi</th>

                <th style="border:1px solid #ccc;padding:6px;">Trả lời</th>

            </tr>

            ${p.fullAnswers.map((item,index)=>`

            <tr ${item.answer=="Có"
                ? 'style="background:#fee2e2;"'
                : ''}>

                <td style="border:1px solid #ccc;padding:6px;text-align:center;">
                    ${index+1}
                </td>

                <td style="border:1px solid #ccc;padding:6px;">
                    ${item.group}
                </td>

                <td style="border:1px solid #ccc;padding:6px;">
                    ${item.question}
                </td>

                <td style="
                    border:1px solid #ccc;
                    padding:6px;
                    text-align:center;
                    font-weight:bold;
                    color:${item.answer=="Có" ? "#dc2626" : "#16a34a"};
                ">
                    ${item.answer}
                </td>

            </tr>

            `).join("")}

        </table>

        `;

    }else{

        answerTable=`
        <div style="padding:20px;text-align:center;">
            Không có dữ liệu bảng câu hỏi.
        </div>
        `;

    }

    document.getElementById("detailContent").innerHTML=`

    <div id="printArea" style="font-family:Arial;line-height:1.5;">

        <h2 style="text-align:center;color:#1d4ed8;">
            BỆNH VIỆN ĐA KHOA THỦ ĐỨC
        </h2>

        <br>

        <table style="width:100%;border-collapse:collapse;">

            <tr>
                <td><b>Mã hồ sơ</b></td>
                <td>${p.id}</td>

                <td><b>Ngày khai báo</b></td>
                <td>${p.time}</td>
            </tr>

            <tr>
                <td><b>Họ tên</b></td>
                <td>${p.name}</td>

                <td><b>Tuổi</b></td>
                <td>${p.age}</td>
            </tr>

            <tr>
                <td><b>SĐT</b></td>
                <td>${p.phone}</td>

                <td><b>Mức nguy cơ</b></td>
                <td>${p.color}</td>
            </tr>

            <tr>
                <td><b>Lý do chụp</b></td>
                <td colspan="3">${p.reason}</td>
            </tr>

        </table>

        ${answerTable}

<div class="signature-section">

<h3>KẾT LUẬN</h3>

<div style="
border:2px solid #000;
padding:12px;
font-size:18px;
font-weight:bold;
">

${
p.color=="RED"
? "🔴 XEM XÉT TRƯỚC KHI CHỤP MRI"
: p.color=="YELLOW"
? "🟡 CÓ THỂ CHỤP MRI"
: "🟢 ĐỦ ĐIỀU KIỆN CHỤP MRI"
}

</div>

<br><br>

<table style="width:100%;">

<tr>

<td style="width:50%;text-align:center;">

TP. Hồ Chí Minh, ngày ..... tháng ..... năm .....

<br><br>

<b>BỆNH NHÂN / NGƯỜI ĐẠI DIỆN</b>

<br>

(Ký và ghi rõ họ tên)

<br><br><br><br><br><br>

....................................

</td>

<td style="width:50%;text-align:center;">

TP. Hồ Chí Minh, ngày ..... tháng ..... năm .....

<br><br>

<b>KỸ THUẬT VIÊN MRI</b>

<br>

(Ký và ghi rõ họ tên)

<br><br><br><br><br><br>

....................................

</td>

</tr>

</table>

</div>
    </div>

    `;

    document.getElementById("detailModal").style.display="block";

}

function closeDetail(){

    document.getElementById("detailModal").style.display="none";

}
    </script>
<!-- Cửa sổ xem chi tiết -->
<div id="detailModal"
     style="display:none;
            position:fixed;
            left:0;
            top:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,.5);
            z-index:9999;">

    <div style="background:#fff;
                width:700px;
                margin:40px auto;
                padding:20px;
                border-radius:8px;">

        <h2>PHIẾU KHAI BÁO AN TOÀN MRI</h2>

        <div id="detailContent"></div>

        <br>

        <button onclick="window.print()">🖨 In phiếu</button>

        <button onclick="closeDetail()">Đóng</button>

    </div>

</div>
</body>
</html>
